/* GitHub角标样式 */
.github-corner:hover .octo-arm {
    animation: octocat-wave 560ms ease-in-out;
}

@keyframes octocat-wave {
    0%, 100% {
        transform: rotate(0);
    }
    20%, 60% {
        transform: rotate(-25deg);
    }
    40%, 80% {
        transform: rotate(10deg);
    }
}

@media (max-width: 500px) {
    .github-corner:hover .octo-arm {
        animation: none;
    }
    .github-corner .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
    }
}

/* ========== 右侧 TOC 卡通风格 ========== */
/* TOC 容器：毛玻璃 + 圆角 + 柔和阴影，融入背景 */
.toc {
    background: rgba(255, 255, 255, 0.55) !important;
    backdrop-filter: blur(12px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(12px) saturate(160%) !important;
    border: 1.5px solid rgba(180, 210, 255, 0.45) !important;
    border-radius: 18px !important;
    box-shadow: 0 4px 24px rgba(100, 160, 255, 0.10), 0 1.5px 6px rgba(0,0,0,0.06) !important;
    overflow: hidden !important;
    transition: box-shadow 0.3s ease !important;
}

.toc:hover {
    box-shadow: 0 8px 32px rgba(100, 160, 255, 0.18), 0 2px 8px rgba(0,0,0,0.08) !important;
}

/* TOC 标题栏：渐变彩色，卡通感 */
.toc .nav__title {
    background: linear-gradient(135deg, #a8d8ff 0%, #c9b8ff 50%, #ffd6f0 100%) !important;
    color: #3a3a5c !important;

    font-weight: 800 !important;

    border-bottom: 1.5px solid rgba(180, 180, 255, 0.25) !important;
}

/* TOC 菜单整体 */
.toc__menu {
    background: transparent !important;
}

/* TOC 各链接项 */
.toc__menu a {
    color: #5a6a8a !important;
    font-size: 0.78em !important;
    font-weight: 500 !important;
    padding: 0.22rem 0.9rem !important;
    border-bottom: 1px solid rgba(180, 210, 255, 0.18) !important;
    border-radius: 0 !important;
    transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease !important;
    line-height: 1.6 !important;
    display: block !important;
}

.toc__menu a:hover {
    background: rgba(168, 216, 255, 0.22) !important;
